name: Build & Release Desktop Apps

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

# Concurrency group to cancel redundant overlapping runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Pre-flight Verification Gate
  # -------------------------------------------------------------
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Test Suite
        run: npm test

  # -------------------------------------------------------------
  # Parallel Build Matrix: Array of direct electron-builder targets
  # -------------------------------------------------------------
  build:
    name: ${{ matrix.build_target.name }}
    needs: [test]
    runs-on: ${{ matrix.build_target.os }}
    strategy:
      fail-fast: false
      matrix:
        build_target:
          # --- macOS Universal DMG ---
          - id: macos-universal-dmg
            name: "macOS Universal (DMG)"
            os: macos-latest
            platform: mac
            builder_cmd: "npx electron-builder --mac dmg --universal -c.mac.artifactName='${productName}-${version}-${arch}-${env.SIGN_STATUS}.${ext}' -c.dmg.artifactName='${productName}-${version}-${arch}-${env.SIGN_STATUS}.${ext}'"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              bash scripts/verify-macos-signing.sh
              node scripts/generate-icons.js

          # --- macOS Universal ZIP ---
          - id: macos-universal-zip
            name: "macOS Universal (ZIP)"
            os: macos-latest
            platform: mac
            builder_cmd: "npx electron-builder --mac zip --universal -c.mac.artifactName='${productName}-${version}-${arch}-${env.SIGN_STATUS}.${ext}' -c.dmg.artifactName='${productName}-${version}-${arch}-${env.SIGN_STATUS}.${ext}'"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              bash scripts/verify-macos-signing.sh
              node scripts/generate-icons.js

          # =========================================================
          # Windows Targets (x64, ia32 32-bit, arm64)
          # =========================================================

          # --- Windows MSI Installer 64-bit ---
          - id: windows-msi-64bit
            name: "Windows (MSI Installer 64-bit)"
            os: windows-latest
            platform: win
            builder_cmd: "npx electron-builder --x64 --win msi"
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            additional_cmd: "node scripts/generate-icons.js"

          # --- Windows NSIS Setup 64-bit ---
          - id: windows-nsis-64bit
            name: "Windows (NSIS Setup 64-bit)"
            os: windows-latest
            platform: win
            builder_cmd: "npx electron-builder --x64 --win nsis"
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            additional_cmd: "node scripts/generate-icons.js"

          # --- Windows Portable ZIP 64-bit ---
          - id: windows-zip-64bit
            name: "Windows (Portable ZIP 64-bit)"
            os: windows-latest
            platform: win
            builder_cmd: "npx electron-builder --x64 --win zip"
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            additional_cmd: "node scripts/generate-icons.js"

          # --- Windows MSI Installer 32-bit (ia32) ---
          - id: windows-msi-32bit
            name: "Windows (MSI Installer 32-bit ia32)"
            os: windows-latest
            platform: win
            builder_cmd: "npx electron-builder --ia32 --win msi"
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            additional_cmd: "node scripts/generate-icons.js"

          # --- Windows NSIS Setup 32-bit (ia32) ---
          - id: windows-nsis-32bit
            name: "Windows (NSIS Setup 32-bit ia32)"
            os: windows-latest
            platform: win
            builder_cmd: "npx electron-builder --ia32 --win nsis"
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            additional_cmd: "node scripts/generate-icons.js"

          # --- Windows Portable ZIP 32-bit (ia32) ---
          - id: windows-zip-32bit
            name: "Windows (Portable ZIP 32-bit ia32)"
            os: windows-latest
            platform: win
            builder_cmd: "npx electron-builder --ia32 --win zip"
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            additional_cmd: "node scripts/generate-icons.js"

          # --- Windows MSI Installer ARM64 ---
          - id: windows-msi-arm64
            name: "Windows (MSI Installer ARM64)"
            os: windows-latest
            platform: win
            builder_cmd: "npx electron-builder --arm64 --win msi"
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            additional_cmd: "node scripts/generate-icons.js"

          # --- Windows NSIS Setup ARM64 ---
          - id: windows-nsis-arm64
            name: "Windows (NSIS Setup ARM64)"
            os: windows-latest
            platform: win
            builder_cmd: "npx electron-builder --arm64 --win nsis"
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            additional_cmd: "node scripts/generate-icons.js"

          # --- Windows Portable ZIP ARM64 ---
          - id: windows-zip-arm64
            name: "Windows (Portable ZIP ARM64)"
            os: windows-latest
            platform: win
            builder_cmd: "npx electron-builder --arm64 --win zip"
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            additional_cmd: "node scripts/generate-icons.js"

          # =========================================================
          # Linux Targets: x64
          # =========================================================

          # --- Linux AppImage x64 ---
          - id: linux-appimage-x64
            name: "Linux x64 (AppImage)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --x64 --linux AppImage"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y libarchive-tools
              node scripts/generate-icons.js

          # --- Linux DEB x64 ---
          - id: linux-deb-x64
            name: "Linux x64 (DEB Package)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --x64 --linux deb"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y libarchive-tools
              node scripts/generate-icons.js

          # --- Linux RPM x64 ---
          - id: linux-rpm-x64
            name: "Linux x64 (RPM)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --x64 --linux rpm"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y rpm libarchive-tools
              node scripts/generate-icons.js

          # --- Linux Pacman x64 ---
          - id: linux-pacman-x64
            name: "Linux x64 (Pacman Package)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --x64 --linux pacman"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y rpm libarchive-tools
              node scripts/generate-icons.js

          # --- Linux Snap Package x64 ---
          - id: linux-snap-x64
            name: "Linux x64 (Snap Package)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --x64 --linux snap"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo snap install snapcraft --classic
              node scripts/generate-icons.js

          # =========================================================
          # Linux Targets: ARM64 (aarch64)
          # =========================================================

          # --- Linux AppImage ARM64 ---
          - id: linux-appimage-arm64
            name: "Linux ARM64 (AppImage)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --arm64 --linux AppImage"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y libarchive-tools
              node scripts/generate-icons.js

          # --- Linux DEB ARM64 ---
          - id: linux-deb-arm64
            name: "Linux ARM64 (DEB Package)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --arm64 --linux deb"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y libarchive-tools
              node scripts/generate-icons.js

          # --- Linux RPM ARM64 ---
          - id: linux-rpm-arm64
            name: "Linux ARM64 (RPM)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --arm64 --linux rpm"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y rpm libarchive-tools
              node scripts/generate-icons.js

          # --- Linux Pacman ARM64 ---
          - id: linux-pacman-arm64
            name: "Linux ARM64 (Pacman Package)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --arm64 --linux pacman"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y rpm libarchive-tools
              node scripts/generate-icons.js

          # =========================================================
          # Linux Targets: ARMv7l (32-bit ARM / Raspberry Pi)
          # =========================================================

          # --- Linux AppImage ARMv7l ---
          - id: linux-appimage-armv7l
            name: "Linux ARMv7l 32-bit (AppImage)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --armv7l --linux AppImage"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y libarchive-tools
              node scripts/generate-icons.js

          # --- Linux DEB ARMv7l ---
          - id: linux-deb-armv7l
            name: "Linux ARMv7l 32-bit (DEB Package)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --armv7l --linux deb"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y libarchive-tools
              node scripts/generate-icons.js

          # --- Linux RPM ARMv7l ---
          - id: linux-rpm-armv7l
            name: "Linux ARMv7l 32-bit (RPM)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --armv7l --linux rpm"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y rpm libarchive-tools
              node scripts/generate-icons.js

          # --- Linux Pacman ARMv7l ---
          - id: linux-pacman-armv7l
            name: "Linux ARMv7l 32-bit (Pacman Package)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --armv7l --linux pacman"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y rpm libarchive-tools
              node scripts/generate-icons.js

          # =========================================================
          # Linux Targets: ia32 (32-bit Intel/AMD x86)
          # =========================================================

          # --- Linux AppImage ia32 ---
          - id: linux-appimage-ia32
            name: "Linux ia32 32-bit (AppImage)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --ia32 --linux AppImage"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y libarchive-tools
              node scripts/generate-icons.js

          # --- Linux DEB ia32 ---
          - id: linux-deb-ia32
            name: "Linux ia32 32-bit (DEB Package)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --ia32 --linux deb"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y libarchive-tools
              node scripts/generate-icons.js

          # --- Linux RPM ia32 ---
          - id: linux-rpm-ia32
            name: "Linux ia32 32-bit (RPM)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --ia32 --linux rpm"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y rpm libarchive-tools
              node scripts/generate-icons.js

          # --- Linux Pacman ia32 ---
          - id: linux-pacman-ia32
            name: "Linux ia32 32-bit (Pacman Package)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --ia32 --linux pacman"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y rpm libarchive-tools
              node scripts/generate-icons.js

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Electron & Builder Tools
        uses: actions/cache@v4
        with:
          path: ${{ matrix.build_target.cache_paths }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Platform-Specific Setup Commands
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ "${{ matrix.build_target.platform }}" = "win" ]; then
            if [ -n "$CSC_LINK" ]; then
              echo "CSC_LINK=$CSC_LINK" >> $GITHUB_ENV
              echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> $GITHUB_ENV
              echo "SIGN_STATUS=signed" >> $GITHUB_ENV
            else
              echo "SIGN_STATUS=unsigned" >> $GITHUB_ENV
            fi
          elif [ "${{ matrix.build_target.platform }}" != "mac" ]; then
            echo "SIGN_STATUS=unsigned" >> $GITHUB_ENV
          fi
          ${{ matrix.build_target.additional_cmd }}

      - name: Build with Direct Electron-Builder Command
        shell: bash
        run: |
          ${{ matrix.build_target.builder_cmd }} --publish never
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Locate & Export app.asar
        shell: bash
        run: |
          ASAR_FOUND=$(find dist -type f -name "app.asar" | head -n 1)
          if [ -n "$ASAR_FOUND" ]; then
            echo "Found asar at $ASAR_FOUND, copying to dist/app.asar"
            cp "$ASAR_FOUND" dist/app.asar
          fi

      - name: Preserve Target-Specific Updater Manifest
        shell: bash
        run: |
          for yml in dist/latest*.yml dist/latest*.yaml; do
            if [ -f "$yml" ]; then
              echo "Preserving $yml as dist/updater-meta-${{ matrix.build_target.id }}.yml"
              cp "$yml" "dist/updater-meta-${{ matrix.build_target.id }}.yml"
            fi
          done

      - name: Upload Target Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build_target.id }}-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.snap
            dist/*.tar.gz
            dist/*.yml
            dist/*.yaml
            dist/*.blockmap
            dist/*.asar
            dist/app.asar
          if-no-files-found: ignore
          retention-days: 30

  # -------------------------------------------------------------
  # Automatic Release Job: No manual git tag required
  # -------------------------------------------------------------
  create-release:
    name: Create & Publish GitHub Release
    needs: [build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version & Release Metadata
        id: release_info
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION}"
          fi
          RELEASE_TITLE="Yom Kippur Diabetes Timer v${VERSION}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "✓ Target Tag: ${TAG_NAME}"
          echo "✓ Release Title: ${RELEASE_TITLE}"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*-artifacts'
          merge-multiple: true

      - name: Ensure app.asar is organized in release assets
        shell: bash
        run: |
          if [ ! -f release-assets/app.asar ]; then
            ASAR_FOUND=$(find release-assets -type f -name "app.asar" | head -n 1)
            if [ -n "$ASAR_FOUND" ]; then
              echo "Promoting nested $ASAR_FOUND to release-assets/app.asar"
              cp "$ASAR_FOUND" release-assets/app.asar
            fi
          fi

      - name: Parse & Merge Multi-OS Updater Manifests
        shell: bash
        run: |
          node scripts/merge-updater-manifests.js release-assets

      - name: Display downloaded assets
        run: |
          echo "--- Downloaded Release Assets ---"
          ls -lhR release-assets/

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.pacman
            release-assets/*.snap
            release-assets/*.tar.gz
            release-assets/*.yml
            release-assets/*.yaml
            release-assets/*.json
            release-assets/*.blockmap
            release-assets/*.asar
            release-assets/app.asar
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
