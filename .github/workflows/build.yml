name: Build & Release Desktop Apps

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

# Concurrency group to cancel redundant overlapping runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Pre-flight Verification Gate
  # -------------------------------------------------------------
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Test Suite
        run: npm test

  # -------------------------------------------------------------
  # Parallel Build Matrix: Array of direct electron-builder targets
  # -------------------------------------------------------------
  build:
    name: ${{ matrix.build_target.name }}
    needs: [test]
    runs-on: ${{ matrix.build_target.os }}
    strategy:
      fail-fast: false
      matrix:
        build_target:
          # --- macOS Universal DMG ---
          - id: macos-universal-dmg
            name: "macOS Universal (DMG)"
            os: macos-latest
            platform: mac
            builder_cmd: "npx electron-builder --mac dmg --universal -c.mac.artifactName='${productName}-${version}-${arch}-${env.SIGN_STATUS}.${ext}' -c.dmg.artifactName='${productName}-${version}-${arch}-${env.SIGN_STATUS}.${ext}'"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              bash scripts/verify-macos-signing.sh
              node scripts/generate-icons.js

          # --- macOS Universal ZIP ---
          - id: macos-universal-zip
            name: "macOS Universal (ZIP)"
            os: macos-latest
            platform: mac
            builder_cmd: "npx electron-builder --mac zip --universal -c.mac.artifactName='${productName}-${version}-${arch}-${env.SIGN_STATUS}.${ext}' -c.dmg.artifactName='${productName}-${version}-${arch}-${env.SIGN_STATUS}.${ext}'"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              bash scripts/verify-macos-signing.sh
              node scripts/generate-icons.js
          # --- Windows MSI Installer ---
          - id: windows-msi
            name: "Windows (MSI Installer)"
            os: windows-latest
            platform: win
            builder_cmd: "npx electron-builder --win msi"
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            additional_cmd: "node scripts/generate-icons.js"

          # --- Windows NSIS Setup ---
          - id: windows-nsis
            name: "Windows (NSIS Setup)"
            os: windows-latest
            platform: win
            builder_cmd: "npx electron-builder --win nsis"
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            additional_cmd: "node scripts/generate-icons.js"

          # --- Windows Portable ZIP ---
          - id: windows-zip
            name: "Windows (Portable ZIP)"
            os: windows-latest
            platform: win
            builder_cmd: "npx electron-builder --win zip"
            cache_paths: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
            additional_cmd: "node scripts/generate-icons.js"

          # --- Linux AppImage ---
          - id: linux-appimage
            name: "Linux (AppImage)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --linux AppImage"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y libarchive-tools
              node scripts/generate-icons.js

          # --- Linux DEB ---
          - id: linux-deb
            name: "Linux (DEB Package)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --linux deb"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y libarchive-tools
              node scripts/generate-icons.js

          # --- Linux RPM ---
          - id: linux-rpm
            name: "Linux (RPM)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --linux rpm"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y rpm libarchive-tools
              node scripts/generate-icons.js

          # --- Linux Pacman ---
          - id: linux-pacman
            name: "Linux (Pacman Package)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --linux pacman"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo apt-get update
              sudo apt-get install -y rpm libarchive-tools
              node scripts/generate-icons.js

          # --- Linux Snap Package ---
          - id: linux-snap
            name: "Linux (Snap Package)"
            os: ubuntu-latest
            platform: linux
            builder_cmd: "npx electron-builder --linux snap"
            cache_paths: |
              ~/.cache/electron
              ~/.cache/electron-builder
            additional_cmd: |
              sudo snap install snapcraft --classic
              node scripts/generate-icons.js

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Electron & Builder Tools
        uses: actions/cache@v4
        with:
          path: ${{ matrix.build_target.cache_paths }}
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Platform-Specific Setup Commands
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGN_STATUS" ]; then
            if [ -n "$CSC_LINK" ]; then
              echo "SIGN_STATUS=signed" >> $GITHUB_ENV
              echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> $GITHUB_ENV
            else
              echo "SIGN_STATUS=unsigned" >> $GITHUB_ENV
              echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> $GITHUB_ENV
            fi
          fi
          ${{ matrix.build_target.additional_cmd }}

      - name: Build with Direct Electron-Builder Command
        shell: bash
        run: |
          ${{ matrix.build_target.builder_cmd }} --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGN_STATUS: ${{ env.SIGN_STATUS }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.CSC_IDENTITY_AUTO_DISCOVERY }}

      - name: Upload Target Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.build_target.id }}-artifacts
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.msi
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.snap
            dist/*.tar.gz
          if-no-files-found: ignore
          retention-days: 30

  # -------------------------------------------------------------
  # Automatic Release Job: No manual git tag required
  # -------------------------------------------------------------
  create-release:
    name: Create & Publish GitHub Release
    needs: [build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Version & Release Metadata
        id: release_info
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION}"
          fi
          RELEASE_TITLE="Yom Kippur Diabetes Timer v${VERSION}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "✓ Target Tag: ${TAG_NAME}"
          echo "✓ Release Title: ${RELEASE_TITLE}"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*-artifacts'
          merge-multiple: true

      - name: Display downloaded assets
        run: |
          echo "--- Downloaded Release Assets ---"
          ls -lhR release-assets/

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.pacman
            release-assets/*.snap
            release-assets/*.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
